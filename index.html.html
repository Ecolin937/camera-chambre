<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Surveillance Multi-Caméras & Alarme</title>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <style>
    body { font-family: sans-serif; text-align: center; background: #121212; color: #fff; margin: 0; padding: 20px; }
    button { padding: 12px 20px; font-size: 16px; margin: 8px; cursor: pointer; border-radius: 8px; border: none; font-weight: bold; }
    .btn-pc { background: #10b981; color: #fff; }
    .btn-cam { background: #2563eb; color: #fff; }
    .btn-flash { background: #eab308; color: #000; padding: 8px 14px; font-size: 14px; }
    .btn-intercom { background: #0284c7; color: #fff; padding: 8px 14px; font-size: 14px; }
    .btn-mask { background: #6366f1; color: #fff; padding: 8px 14px; font-size: 14px; }
    .btn-reset-mask { background: #4b5563; color: #fff; padding: 8px 14px; font-size: 14px; }
    .btn-ctrl { background: #374151; color: #fff; padding: 10px 16px; font-size: 14px; }
    .btn-disabled { background: #991b1b !important; }
    #status { font-size: 18px; margin: 15px 0; font-weight: bold; }
    .alert { color: #ff3333; }

    #red-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(255, 60, 60, 0.35);
      pointer-events: none;
      opacity: 0;
      z-index: 9999;
      transition: opacity 0.15s ease-in-out;
    }
    .flash-active {
      opacity: 1 !important;
    }
    
    #cameras-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      margin-top: 20px;
    }
    .cam-card {
      background: #1e1e1e;
      border: 1px solid #333;
      border-radius: 12px;
      padding: 12px;
      width: 90%;
      max-width: 480px;
    }
    .cam-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      font-size: 14px;
      color: #aaa;
    }
    
    .video-wrapper {
      position: relative;
      width: 100%;
      border-radius: 8px;
      overflow: hidden;
      background: #000;
      aspect-ratio: 4 / 3;
    }
    .video-wrapper video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .video-wrapper canvas.overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      cursor: default;
    }
  </style>
</head>
<body>

  <div id="red-overlay"></div>

  <h1>📹 Surveillance Multi-Caméras</h1>

  <div id="setup">
    <button class="btn-cam" onclick="demarrerCamera()">📱/📟 Mode Caméra (Téléphone ou Tablette)</button>
    <button class="btn-pc" onclick="demarrerPC()">💻 Mode PC (Écran de contrôle)</button>
  </div>

  <div id="pc-controls" style="display:none; margin-bottom: 10px;">
    <button id="btn-toggle-sound" class="btn-ctrl" onclick="toggleSon()">🔊 Son : Activé</button>
    <button id="btn-toggle-flash-ecran" class="btn-ctrl" onclick="toggleFlashEcran()">🚨 Flash écran : Activé</button>
  </div>

  <div id="status">Choisis un mode pour commencer</div>

  <div id="local-preview" style="display:none; max-width: 400px; margin: 0 auto;">
    <div class="video-wrapper">
      <video id="flux-local" autoplay playsinline muted></video>
    </div>
    <audio id="audio-retour" autoplay playsinline></audio>
    <canvas id="canvas-analysis" width="128" height="96" style="display:none;"></canvas>
  </div>

  <div id="cameras-grid" style="display:none;"></div>

  <script>
    const ROOM_ID = "alarme-chambre-perso-2026";
    
    const PEER_CONFIG = {
      config: {
        iceServers: [
          { urls: "stun:stun.l.google.com:19302" },
          { urls: "stun:stun1.l.google.com:19302" }
        ]
      }
    };

    let peer = null;
    const connections = {};
    const masks = {};
    const activeIntercoms = {};
    let pcAudioStream = null;

    let sonActive = true;
    let flashEcranActive = true;

    function jouerBip() {
      if (!sonActive) return;
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        osc.type = "sine";
        osc.frequency.setValueAtTime(880, audioCtx.currentTime);
        osc.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.35);
      } catch (e) {
        console.warn("Audio error:", e);
      }
    }

    function declencherFlashEcran() {
      if (!flashEcranActive) return;
      const overlay = document.getElementById("red-overlay");
      overlay.classList.add("flash-active");
      setTimeout(() => overlay.classList.remove("flash-active"), 200);
      setTimeout(() => overlay.classList.add("flash-active"), 400);
      setTimeout(() => overlay.classList.remove("flash-active"), 650);
    }

    function toggleSon() {
      sonActive = !sonActive;
      const btn = document.getElementById("btn-toggle-sound");
      btn.innerText = sonActive ? "🔊 Son : Activé" : "🔇 Son : Coupé";
      btn.classList.toggle("btn-disabled", !sonActive);
    }

    function toggleFlashEcran() {
      flashEcranActive = !flashEcranActive;
      const btn = document.getElementById("btn-toggle-flash-ecran");
      btn.innerText = flashEcranActive ? "🚨 Flash écran : Activé" : "⚪ Flash écran : Désactivé";
      btn.classList.toggle("btn-disabled", !flashEcranActive);
    }

    function rafraichirOverlay(peerId) {
      const canvasOverlay = document.getElementById(`overlay-${peerId}`);
      if (!canvasOverlay) return;
      const ctx = canvasOverlay.getContext("2d");
      ctx.clearRect(0, 0, canvasOverlay.width, canvasOverlay.height);

      const scaleX = canvasOverlay.width / 128;
      const scaleY = canvasOverlay.height / 96;

      const mask = masks[peerId];
      if (mask) {
        ctx.fillStyle = "rgba(100, 100, 100, 0.45)";
        ctx.strokeStyle = "#818cf8";
        ctx.lineWidth = 2;
        ctx.setLineDash([6, 4]);

        const mx = mask.minX * scaleX;
        const my = mask.minY * scaleY;
        const mw = (mask.maxX - mask.minX) * scaleX;
        const mh = (mask.maxY - mask.minY) * scaleY;

        ctx.fillRect(mx, my, mw, mh);
        ctx.strokeRect(mx, my, mw, mh);
        ctx.setLineDash([]);

        ctx.fillStyle = "#818cf8";
        ctx.font = "12px sans-serif";
        ctx.fillText("Zone ignorée", mx + 5, my + 15);
      }
    }

    function demarrerPC() {
      document.getElementById("setup").style.display = "none";
      document.getElementById("pc-controls").style.display = "block";
      document.getElementById("cameras-grid").style.display = "flex";
      const status = document.getElementById("status");
      status.innerText = "💻 En attente de connexion des appareils...";

      jouerBip();

      peer = new Peer(ROOM_ID, PEER_CONFIG);

      peer.on("call", (call) => {
        const peerId = call.peer;
        call.answer();

        call.on("stream", (remoteStream) => {
          creerOuMettreAJourEcran(peerId, remoteStream);
          status.innerText = "💻 Surveillance active. Appareils connectés !";
        });
      });

      peer.on("connection", (conn) => {
        const peerId = conn.peer;
        connections[peerId] = conn;

        conn.on("data", (data) => {
          if (data && data.type === "BATTERY") {
            const batEl = document.getElementById(`bat-${peerId}`);
            if (batEl) batEl.innerText = `🔋 ${data.level}%`;
          }

          if (data && data.type === "MOUVEMENT") {
            const nomAppareil = document.getElementById(`title-${peerId}`)?.innerText || "Une caméra";
            status.innerHTML = `<span class='alert'>🚨 MOUVEMENT SUR : ${nomAppareil} !</span>`;
            jouerBip();
            declencherFlashEcran();

            setTimeout(() => {
              status.innerText = "💻 Surveillance active...";
            }, 2500);
          }
        });

        conn.on("close", () => {
          const card = document.getElementById(`card-${peerId}`);
          if (card) card.remove();
          if (activeIntercoms[peerId]) {
            activeIntercoms[peerId].close();
            delete activeIntercoms[peerId];
          }
          delete connections[peerId];
          delete masks[peerId];
        });
      });

      peer.on("error", (err) => {
        console.error(err);
        if (err.type === "unavailable-id") {
          status.innerText = "⚠️ Erreur : ID déjà occupé. Recharge la page.";
        }
      });
    }

    function creerOuMettreAJourEcran(peerId, stream) {
      let card = document.getElementById(`card-${peerId}`);
      if (!card) {
        const count = document.querySelectorAll(".cam-card").length + 1;
        card = document.createElement("div");
        card.className = "cam-card";
        card.id = `card-${peerId}`;

        card.innerHTML = `
          <div class="cam-header">
            <span id="title-${peerId}" style="font-weight:bold; color:#fff;">Caméra ${count}</span>
            <span id="bat-${peerId}">🔋 --%</span>
          </div>
          <div class="video-wrapper">
            <video id="video-${peerId}" autoplay playsinline muted></video>
            <canvas id="overlay-${peerId}" class="overlay" width="480" height="360"></canvas>
          </div>
          <div style="margin-top: 10px; display: flex; flex-wrap: wrap; justify-content: center; gap: 6px;">
            <button class="btn-flash" onclick="basculerFlash('${peerId}')">🔦 Flash</button>
            <button id="btn-intercom-${peerId}" class="btn-intercom" onclick="basculerInterphone('${peerId}')">🎙️ Interphone : OFF</button>
            <button id="btn-draw-${peerId}" class="btn-mask" onclick="activerDessinMasque('${peerId}')">🚫 Définir zone ignorée</button>
            <button class="btn-reset-mask" onclick="effacerMasque('${peerId}')">🔄 Effacer zone</button>
          </div>
        `;
        document.getElementById("cameras-grid").appendChild(card);
        initialiserTracerMasque(peerId);
      }
      const vid = document.getElementById(`video-${peerId}`);
      vid.srcObject = stream;
      vid.play().catch(e => console.log("Lecture automatique :", e));
    }

    function basculerFlash(peerId) {
      if (connections[peerId]) {
        connections[peerId].send({ type: "TOGGLE_FLASH" });
      }
    }

    async function basculerInterphone(peerId) {
      const conn = connections[peerId];
      const btn = document.getElementById(`btn-intercom-${peerId}`);
      const vid = document.getElementById(`video-${peerId}`);
      if (!conn) return;

      if (!activeIntercoms[peerId]) {
        try {
          if (!pcAudioStream) {
            pcAudioStream = await navigator.mediaDevices.getUserMedia({ audio: true });
          }
          const audioCall = peer.call(peerId, pcAudioStream);
          activeIntercoms[peerId] = audioCall;

          if (vid) vid.muted = false;
          conn.send({ type: "INTERCOM_STATE", active: true });

          btn.innerText = "🎙️ Interphone : ACTIF";
          btn.style.background = "#ef4444";
        } catch (err) {
          alert("Microphone du PC inaccessible : " + err.message);
        }
      } else {
        if (activeIntercoms[peerId]) {
          activeIntercoms[peerId].close();
          delete activeIntercoms[peerId];
        }
        if (vid) vid.muted = true;
        conn.send({ type: "INTERCOM_STATE", active: false });

        btn.innerText = "🎙️ Interphone : OFF";
        btn.style.background = "#0284c7";
      }
    }

    let modeTracerActif = {};
    function activerDessinMasque(peerId) {
      modeTracerActif[peerId] = !modeTracerActif[peerId];
      const btn = document.getElementById(`btn-draw-${peerId}`);
      const cvs = document.getElementById(`overlay-${peerId}`);
      if (modeTracerActif[peerId]) {
        btn.innerText = "✏️ Tracez sur la vidéo...";
        btn.style.background = "#ef4444";
        cvs.style.cursor = "crosshair";
      } else {
        btn.innerText = "🚫 Définir zone ignorée";
        btn.style.background = "#6366f1";
        cvs.style.cursor = "default";
      }
    }

    function initialiserTracerMasque(peerId) {
      const canvas = document.getElementById(`overlay-${peerId}`);
      let debutX, debutY, glisse = false;

      canvas.addEventListener("mousedown", (e) => {
        if (!modeTracerActif[peerId]) return;
        const rect = canvas.getBoundingClientRect();
        debutX = e.clientX - rect.left;
        debutY = e.clientY - rect.top;
        glisse = true;
      });

      canvas.addEventListener("mousemove", (e) => {
        if (!glisse || !modeTracerActif[peerId]) return;
        const rect = canvas.getBoundingClientRect();
        const curX = e.clientX - rect.left;
        const curY = e.clientY - rect.top;

        rafraichirOverlay(peerId);
        const ctx = canvas.getContext("2d");
        ctx.strokeStyle = "#818cf8";
        ctx.lineWidth = 2;
        ctx.strokeRect(debutX, debutY, curX - debutX, curY - debutY);
      });

      canvas.addEventListener("mouseup", (e) => {
        if (!glisse || !modeTracerActif[peerId]) return;
        glisse = false;
        const rect = canvas.getBoundingClientRect();
        const finX = e.clientX - rect.left;
        const finY = e.clientY - rect.top;

        const scaleX = 128 / canvas.width;
        const scaleY = 96 / canvas.height;

        const x1 = Math.min(debutX, finX) * scaleX;
        const x2 = Math.max(debutX, finX) * scaleX;
        const y1 = Math.min(debutY, finY) * scaleY;
        const y2 = Math.max(debutY, finY) * scaleY;

        masks[peerId] = { minX: x1, maxX: x2, minY: y1, maxY: y2 };

        if (connections[peerId]) {
          connections[peerId].send({
            type: "SET_MASK",
            mask: masks[peerId]
          });
        }

        activerDessinMasque(peerId);
        rafraichirOverlay(peerId);
      });
    }

    function effacerMasque(peerId) {
      delete masks[peerId];
      if (connections[peerId]) {
        connections[peerId].send({ type: "SET_MASK", mask: null });
      }
      rafraichirOverlay(peerId);
    }

    let trackVideo = null;
    let flashAllume = false;
    let dernierFlux = null;
    let antiSpam = false;
    let masqueIgnore = null;
    let localStream = null;

    async function demarrerCamera() {
      document.getElementById("setup").style.display = "none";
      document.getElementById("local-preview").style.display = "block";
      const status = document.getElementById("status");
      status.innerText = "📱 Connexion en cours...";

      const video = document.getElementById("flux-local");
      video.muted = true;

      localStream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: "environment" },
        audio: true
      });
      localStream.getAudioTracks().forEach(t => t.enabled = false);

      video.srcObject = localStream;
      trackVideo = localStream.getVideoTracks()[0];

      peer = new Peer(undefined, PEER_CONFIG);

      peer.on("open", () => {
        status.innerText = "📱 Relié au réseau. Connexion au PC...";

        const conn = peer.connect(ROOM_ID, { reliable: true });

        conn.on("open", () => {
          status.innerText = "📱 Connecté ! Envoi de la vidéo...";
          
          peer.call(ROOM_ID, localStream);

          setTimeout(() => {
            status.innerText = "📱 En direct ! Pose l'appareil face à la zone.";
          }, 1000);

          envoyerBatterie(conn);

          conn.on("data", async (msg) => {
            if (msg && msg.type === "TOGGLE_FLASH") {
              flashAllume = !flashAllume;
              try {
                await trackVideo.applyConstraints({
                  advanced: [{ torch: flashAllume }]
                });
              } catch (e) {
                console.warn("Flash non supporté", e);
              }
            }

            if (msg && msg.type === "SET_MASK") {
              masqueIgnore = msg.mask;
            }

            if (msg && msg.type === "INTERCOM_STATE") {
              if (localStream) {
                localStream.getAudioTracks().forEach(t => t.enabled = msg.active);
              }
            }
          });

          peer.on("call", (incomingCall) => {
            incomingCall.answer();
            incomingCall.on("stream", (remoteAudio) => {
              const audioEl = document.getElementById("audio-retour");
              if (audioEl) {
                audioEl.srcObject = remoteAudio;
                audioEl.play().catch(e => console.warn(e));
              }
            });
          });

          const canvas = document.getElementById("canvas-analysis");
          const ctx = canvas.getContext("2d", { willReadFrequently: true });

          setInterval(() => {
            if (video.readyState < 2) return;

            const W = 128;
            const H = 96;
            ctx.drawImage(video, 0, 0, W, H);
            const imageActuelle = ctx.getImageData(0, 0, W, H).data;

            if (dernierFlux) {
              let scoreDiff = 0;

              for (let i = 0; i < imageActuelle.length; i += 4) {
                const diff = Math.abs(imageActuelle[i] - dernierFlux[i]);
                if (diff > 25) {
                  const pixelIndex = i / 4;
                  const px = pixelIndex % W;
                  const py = Math.floor(pixelIndex / W);

                  if (masqueIgnore) {
                    if (px >= masqueIgnore.minX && px <= masqueIgnore.maxX &&
                        py >= masqueIgnore.minY && py <= masqueIgnore.maxY) {
                      continue;
                    }
                  }

                  scoreDiff++;
                }
              }

              if (scoreDiff > 50 && !antiSpam) {
                antiSpam = true;
                status.innerHTML = "<span class='alert'>⚠️ Mouvement détecté ! Signal envoyé...</span>";
                
                conn.send({ type: "MOUVEMENT" });

                setTimeout(() => {
                  antiSpam = false;
                  status.innerText = "📱 En direct. Surveillance active...";
                }, 2000);
              }
            }
            dernierFlux = imageActuelle;
          }, 150);
        });
      });
    }

    function envoyerBatterie(conn) {
      if (navigator.getBattery) {
        navigator.getBattery().then((battery) => {
          const update = () => {
            conn.send({
              type: "BATTERY",
              level: Math.round(battery.level * 100)
            });
          };
          update();
          battery.addEventListener("levelchange", update);
        });
      }
    }
  </script>
</body>
</html>
