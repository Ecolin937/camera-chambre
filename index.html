<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Surveillance Multi-Caméras & Alarme</title>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <style>
    body { font-family: sans-serif; text-align: center; background: #121212; color: #fff; margin: 0; padding: 20px; }
    button { padding: 12px 20px; font-size: 16px; margin: 8px; cursor: pointer; border-radius: 8px; border: none; font-weight: bold; }
    .btn-pc { background: #10b981; color: #fff; }
    .btn-cam { background: #2563eb; color: #fff; }
    .btn-flash { background: #eab308; color: #000; padding: 8px 14px; font-size: 14px; }
    .btn-intercom { background: #0284c7; color: #fff; padding: 8px 14px; font-size: 14px; }
    .btn-mask { background: #6366f1; color: #fff; padding: 8px 14px; font-size: 14px; }
    .btn-reset-mask { background: #4b5563; color: #fff; padding: 8px 14px; font-size: 14px; }
    .btn-ctrl { background: #374151; color: #fff; padding: 10px 16px; font-size: 14px; }
    .btn-disabled { background: #991b1b !important; }
    #status { font-size: 18px; margin: 15px 0; font-weight: bold; }
    .alert { color: #ff3333; }
    .pin-box { font-size: 32px; letter-spacing: 4px; font-weight: bold; color: #10b981; background: #1e1e1e; display: inline-block; padding: 10px 20px; border-radius: 8px; margin: 10px 0; }
    input[type="number"] { font-size: 20px; padding: 10px; width: 140px; text-align: center; border-radius: 8px; border: 1px solid #444; background: #222; color: #fff; }
    #red-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(255, 60, 60, 0.35); pointer-events: none; opacity: 0; z-index: 9999; transition: opacity 0.15s ease-in-out; }
    .flash-active { opacity: 1 !important; }
    #cameras-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; margin-top: 20px; }
    .cam-card { background: #1e1e1e; border: 1px solid #333; border-radius: 12px; padding: 12px; width: 90%; max-width: 480px; }
    .cam-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 14px; color: #aaa; }
    .video-wrapper { position: relative; width: 100%; border-radius: 8px; overflow: hidden; background: #000; aspect-ratio: 4 / 3; }
    .video-wrapper video { width: 100%; height: 100%; object-fit: cover; display: block; }
    .video-wrapper canvas.overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; cursor: default; }
  </style>
</head>
<body>
  <div id="red-overlay"></div>
  <h1>📹 Surveillance Multi-Caméras</h1>

  <div id="setup">
    <button class="btn-pc" onclick="demarrerPC()">💻 Mode PC (Écran de contrôle)</button>
    <br><br>
    <div style="border-top: 1px solid #333; padding-top: 15px; max-width: 350px; margin: 0 auto;">
      <p style="margin: 0 0 10px 0; color: #aaa;">Pour le téléphone :</p>
      <input type="number" id="input-pin" placeholder="Code PC" /><br>
      <button class="btn-cam" onclick="demarrerCamera()">📱 Démarrer Caméra</button>
    </div>
  </div>

  <div id="pc-controls" style="display:none; margin-bottom: 10px;">
    <button id="btn-toggle-sound" class="btn-ctrl" onclick="toggleSon()">🔊 Son : Activé</button>
    <button id="btn-toggle-flash-ecran" class="btn-ctrl" onclick="toggleFlashEcran()">🚨 Flash écran : Activé</button>
  </div>

  <div id="status">Choisis un mode pour commencer</div>

  <div id="local-preview" style="display:none; max-width: 400px; margin: 0 auto;">
    <div class="video-wrapper">
      <video id="flux-local" autoplay playsinline muted></video>
    </div>
    <audio id="audio-retour" autoplay playsinline></audio>
    <canvas id="canvas-analysis" width="128" height="96" style="display:none;"></canvas>
  </div>

  <div id="cameras-grid" style="display:none;"></div>

  <script>
    var PEER_CONFIG = {
      config: {
        iceServers: [
          { urls: "stun:stun.l.google.com:19302" },
          { urls: "stun:stun1.l.google.com:19302" }
        ]
      }
    };

    var peer = null;
    var connections = {};
    var masks = {};
    var activeIntercoms = {};
    var pcAudioStream = null;
    var sonActive = true;
    var flashEcranActive = true;

    function jouerBip() {
      if (!sonActive) return;
      try {
        var audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        var osc = audioCtx.createOscillator();
        osc.type = "sine";
        osc.frequency.setValueAtTime(880, audioCtx.currentTime);
        osc.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.35);
      } catch (e) {
        console.warn(e);
      }
    }

    function declencherFlashEcran() {
      if (!flashEcranActive) return;
      var overlay = document.getElementById("red-overlay");
      overlay.classList.add("flash-active");
      setTimeout(function() { overlay.classList.remove("flash-active"); }, 200);
      setTimeout(function() { overlay.classList.add("flash-active"); }, 400);
      setTimeout(function() { overlay.classList.remove("flash-active"); }, 650);
    }

    function toggleSon() {
      sonActive = !sonActive;
      var btn = document.getElementById("btn-toggle-sound");
      btn.innerText = sonActive ? "🔊 Son : Activé" : "🔇 Son : Coupé";
      btn.classList.toggle("btn-disabled", !sonActive);
    }

    function toggleFlashEcran() {
      flashEcranActive = !flashEcranActive;
      var btn = document.getElementById("btn-toggle-flash-ecran");
      btn.innerText = flashEcranActive ? "🚨 Flash écran : Activé" : "⚪ Flash écran : Désactivé";
      btn.classList.toggle("btn-disabled", !flashEcranActive);
    }

    function rafraichirOverlay(peerId) {
      var canvasOverlay = document.getElementById("overlay-" + peerId);
      if (!canvasOverlay) return;
      var ctx = canvasOverlay.getContext("2d");
      ctx.clearRect(0, 0, canvasOverlay.width, canvasOverlay.height);

      var scaleX = canvasOverlay.width / 128;
      var scaleY = canvasOverlay.height / 96;
      var mask = masks[peerId];

      if (mask) {
        ctx.fillStyle = "rgba(100, 100, 100, 0.45)";
        ctx.strokeStyle = "#818cf8";
        ctx.lineWidth = 2;
        ctx.setLineDash([6, 4]);

        var mx = mask.minX * scaleX;
        var my = mask.minY * scaleY;
        var mw = (mask.maxX - mask.minX) * scaleX;
        var mh = (mask.maxY - mask.minY) * scaleY;

        ctx.fillRect(mx, my, mw, mh);
        ctx.strokeRect(mx, my, mw, mh);
        ctx.setLineDash([]);

        ctx.fillStyle = "#818cf8";
        ctx.font = "12px sans-serif";
        ctx.fillText("Zone ignorée", mx + 5, my + 15);
      }
    }

    function demarrerPC() {
      document.getElementById("setup").style.display = "none";
      document.getElementById("pc-controls").style.display = "block";
      document.getElementById("cameras-grid").style.display = "flex";
      var status = document.getElementById("status");

      jouerBip();

      var codePin = Math.floor(1000 + Math.random() * 9000).toString();
      var pcId = "cam-pc-" + codePin;

      peer = new Peer(pcId, PEER_CONFIG);

      peer.on("open", function() {
        status.innerHTML = "💻 Ton code de connexion :<br><div class=\"pin-box\">" + codePin + "</div><br><span style=\"font-size:14px; color:#aaa;\">Tape ce code sur ton téléphone</span>";
      });

      peer.on("call", function(call) {
        var peerId = call.peer;
        call.answer();
        call.on("stream", function(remoteStream) {
          creerOuMettreAJourEcran(peerId, remoteStream);
        });
      });

      peer.on("connection", function(conn) {
        var peerId = conn.peer;
        connections[peerId] = conn;

        conn.on("data", function(data) {
          if (data && data.type === "BATTERY") {
            var batEl = document.getElementById("bat-" + peerId);
            if (batEl) batEl.innerText = "🔋 " + data.level + "%";
          }

          if (data && data.type === "MOUVEMENT") {
            var elTitle = document.getElementById("title-" + peerId);
            var nomAppareil = elTitle ? elTitle.innerText : "Une caméra";
            status.innerHTML = "<span class='alert'>🚨 MOUVEMENT SUR : " + nomAppareil + " !</span>";
            jouerBip();
            declencherFlashEcran();

            setTimeout(function() {
              status.innerHTML = "💻 Connecté sous le code : <b>" + codePin + "</b>";
            }, 2500);
          }
        });

        conn.on("close", function() {
          var card = document.getElementById("card-" + peerId);
          if (card) card.remove();
          if (activeIntercoms[peerId]) {
            activeIntercoms[peerId].close();
            delete activeIntercoms[peerId];
          }
          delete connections[peerId];
          delete masks[peerId];
        });
      });
    }

    function creerOuMettreAJourEcran(peerId, stream) {
      var card = document.getElementById("card-" + peerId);
      if (!card) {
        var count = document.querySelectorAll(".cam-card").length + 1;
        card = document.createElement("div");
        card.className = "cam-card";
        card.id = "card-" + peerId;

        card.innerHTML = 
          "<div class=\"cam-header\">" +
            "<span id=\"title-" + peerId + "\" style=\"font-weight:bold; color:#fff;\">Caméra " + count + "</span>" +
            "<span id=\"bat-" + peerId + "\">🔋 --%</span>" +
          "</div>" +
          "<div class=\"video-wrapper\">" +
            "<video id=\"video-" + peerId + "\" autoplay playsinline muted></video>" +
            "<canvas id=\"overlay-" + peerId + "\" class=\"overlay\" width=\"480\" height=\"360\"></canvas>" +
          "</div>" +
          "<div style=\"margin-top: 10px; display: flex; flex-wrap: wrap; justify-content: center; gap: 6px;\">" +
            "<button class=\"btn-flash\" onclick=\"basculerFlash('" + peerId + "')\">🔦 Flash</button>" +
            "<button id=\"btn-intercom-" + peerId + "\" class=\"btn-intercom\" onclick=\"basculerInterphone('" + peerId + "')\">🎙️ Interphone : OFF</button>" +
            "<button id=\"btn-draw-" + peerId + "\" class=\"btn-mask\" onclick=\"activerDessinMasque('" + peerId + "')\">🚫 Définir zone ignorée</button>" +
            "<button class=\"btn-reset-mask\" onclick=\"effacerMasque('" + peerId + "')\">🔄 Effacer zone</button>" +
          "</div>";

        document.getElementById("cameras-grid").appendChild(card);
        initialiserTracerMasque(peerId);
      }
      var vid = document.getElementById("video-" + peerId);
      vid.srcObject = stream;
      vid.play().catch(function(e) { console.log(e); });
    }

    function basculerFlash(peerId) {
      if (connections[peerId]) connections[peerId].send({ type: "TOGGLE_FLASH" });
    }

    async function basculerInterphone(peerId) {
      var conn = connections[peerId];
      var btn = document.getElementById("btn-intercom-" + peerId);
      var vid = document.getElementById("video-" + peerId);
      if (!conn) return;

      if (!activeIntercoms[peerId]) {
        try {
          if (!pcAudioStream) {
            pcAudioStream = await navigator.mediaDevices.getUserMedia({ audio: true });
          }
          var audioCall = peer.call(peerId, pcAudioStream);
          activeIntercoms[peerId] = audioCall;
          if (vid) vid.muted = false;
          conn.send({ type: "INTERCOM_STATE", active: true });
          btn.innerText = "🎙️ Interphone : ACTIF";
          btn.style.background = "#ef4444";
        } catch (err) {
          alert("Micro inaccessible : " + err.message);
        }
      } else {
        if (activeIntercoms[peerId]) {
          activeIntercoms[peerId].close();
          delete activeIntercoms[peerId];
        }
        if (vid) vid.muted = true;
        conn.send({ type: "INTERCOM_STATE", active: false });
        btn.innerText = "🎙️ Interphone : OFF";
        btn.style.background = "#0284c7";
      }
    }

    var modeTracerActif = {};
    function activerDessinMasque(peerId) {
      modeTracerActif[peerId] = !modeTracerActif[peerId];
      var btn = document.getElementById("btn-draw-" + peerId);
      var cvs = document.getElementById("overlay-" + peerId);
      if (modeTracerActif[peerId]) {
        btn.innerText = "✏️ Tracez sur la vidéo...";
        btn.style.background = "#ef4444";
        cvs.style.cursor = "crosshair";
      } else {
        btn.innerText = "🚫 Définir zone ignorée";
        btn.style.background = "#6366f1";
        cvs.style.cursor = "default";
      }
    }

    function initialiserTracerMasque(peerId) {
      var canvas = document.getElementById("overlay-" + peerId);
      var debutX, debutY, glisse = false;

      canvas.addEventListener("mousedown", function(e) {
        if (!modeTracerActif[peerId]) return;
        var rect = canvas.getBoundingClientRect();
        debutX = e.clientX - rect.left;
        debutY = e.clientY - rect.top;
        glisse = true;
      });

      canvas.addEventListener("mousemove", function(e) {
        if (!glisse || !modeTracerActif[peerId]) return;
        var rect = canvas.getBoundingClientRect();
        var curX = e.clientX - rect.left;
        var curY = e.clientY - rect.top;
        rafraichirOverlay(peerId);
        var ctx = canvas.getContext("2d");
        ctx.strokeStyle = "#818cf8";
        ctx.lineWidth = 2;
        ctx.strokeRect(debutX, debutY, curX - debutX, curY - debutY);
      });

      canvas.addEventListener("mouseup", function(e) {
        if (!glisse || !modeTracerActif[peerId]) return;
        glisse = false;
        var rect = canvas.getBoundingClientRect();
        var finX = e.clientX - rect.left;
        var finY = e.clientY - rect.top;

        var scaleX = 128 / canvas.width;
        var scaleY = 96 / canvas.height;

        masks[peerId] = {
          minX: Math.min(debutX, finX) * scaleX,
          maxX: Math.max(debutX, finX) * scaleX,
          minY: Math.min(debutY, finY) * scaleY,
          maxY: Math.max(debutY, finY) * scaleY
        };

        if (connections[peerId]) connections[peerId].send({ type: "SET_MASK", mask: masks[peerId] });
        activerDessinMasque(peerId);
        rafraichirOverlay(peerId);
      });
    }

    function effacerMasque(peerId) {
      delete masks[peerId];
      if (connections[peerId]) connections[peerId].send({ type: "SET_MASK", mask: null });
      rafraichirOverlay(peerId);
    }

    var trackVideo = null;
    var flashAllume = false;
    var dernierFlux = null;
    var antiSpam = false;
    var masqueIgnore = null;
    var localStream = null;

    async function demarrerCamera() {
      var codePin = document.getElementById("input-pin").value.trim();
      var status = document.getElementById("status");

      if (!codePin) {
        alert("Entre le code affiché sur ton PC !");
        return;
      }

      var pcId = "cam-pc-" + codePin;

      try {
        document.getElementById("setup").style.display = "none";
        document.getElementById("local-preview").style.display = "block";
        status.innerText = "📱 Ouverture caméra & micro...";

        var video = document.getElementById("flux-local");
        video.muted = true;

        localStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "environment" },
          audio: true
        });
        localStream.getAudioTracks().forEach(function(t) { t.enabled = false; });

        video.srcObject = localStream;
        trackVideo = localStream.getVideoTracks()[0];

        status.innerText = "📱 Connexion au code " + codePin + "...";

        peer = new Peer(undefined, PEER_CONFIG);

        peer.on("open", function() {
          var conn = peer.connect(pcId, { reliable: true });

          conn.on("open", function() {
            status.innerText = "📱 Connecté au PC ! Envoi de la vidéo...";
            peer.call(pcId, localStream);

            setTimeout(function() {
              status.innerText = "📱 En direct ! Pose l'appareil face à la zone.";
            }, 1000);

            envoyerBatterie(conn);

            conn.on("data", async function(msg) {
              if (msg && msg.type === "TOGGLE_FLASH") {
                flashAllume = !flashAllume;
                try {
                  await trackVideo.applyConstraints({ advanced: [{ torch: flashAllume }] });
                } catch (e) {
                  console.warn(e);
                }
              }
              if (msg && msg.type === "SET_MASK") masqueIgnore = msg.mask;
              if (msg && msg.type === "INTERCOM_STATE") {
                if (localStream) localStream.getAudioTracks().forEach(function(t) { t.enabled = msg.active; });
              }
            });

            peer.on("call", function(call) {
              call.answer();
              call.on("stream", function(remoteAudio) {
                var audioEl = document.getElementById("audio-retour");
                if (audioEl) {
                  audioEl.srcObject = remoteAudio;
                  audioEl.play().catch(function(e) { console.warn(e); });
                }
              });
            });

            var canvas = document.getElementById("canvas-analysis");
            var ctx = canvas.getContext("2d", { willReadFrequently: true });

            setInterval(function() {
              if (video.readyState < 2) return;
              var W = 128, H = 96;
              ctx.drawImage(video, 0, 0, W, H);
              var imageActuelle = ctx.getImageData(0, 0, W, H).data;

              if (dernierFlux) {
                var scoreDiff = 0;
                for (var i = 0; i < imageActuelle.length; i += 4) {
                  var diff = Math.abs(imageActuelle[i] - dernierFlux[i]);
                  if (diff > 25) {
                    var px = (i / 4) % W;
                    var py = Math.floor((i / 4) / W);
                    if (masqueIgnore && px >= masqueIgnore.minX && px <= masqueIgnore.maxX && py >= masqueIgnore.minY && py <= masqueIgnore.maxY) {
                      continue;
                    }
                    scoreDiff++;
                  }
                }

                if (scoreDiff > 50 && !antiSpam) {
                  antiSpam = true;
                  status.innerHTML = "<span class='alert'>⚠️ Mouvement détecté ! Signal envoyé...</span>";
                  conn.send({ type: "MOUVEMENT" });
                  setTimeout(function() {
                    antiSpam = false;
                    status.innerText = "📱 En direct. Surveillance active...";
                  }, 2000);
                }
              }
              dernierFlux = imageActuelle;
            }, 150);
          });

          conn.on("error", function(err) {
            status.innerText = "⚠️ Code invalide ou PC non connecté.";
          });
        });

      } catch (err) {
        status.innerText = "⚠️ Erreur accès caméra : " + err.message;
      }
    }

    function envoyerBatterie(conn) {
      if (navigator.getBattery) {
        navigator.getBattery().then(function(battery) {
          var update = function() { conn.send({ type: "BATTERY", level: Math.round(battery.level * 100) }); };
          update();
          battery.addEventListener("levelchange", update);
        });
      }
    }
  </script>
</body>
</html>
